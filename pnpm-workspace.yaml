packages:
  - "apps/*"
  - "packages/*"

overrides:
  deepmerge-ts: 8.0.0
  effect: 3.22.1
  multer: 2.5.0

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@aws-sdk/client-s3@3.1158.0'
  - '@aws-sdk/s3-request-presigner@3.1158.0'

onlyBuiltDependencies:
  - "@prisma/client"
  - "@prisma/engines"
  - "@scarf/scarf"
  - "esbuild"
  - "msgpackr-extract"
  - "prisma"
  - "sharp"
  - "unrs-resolver"
