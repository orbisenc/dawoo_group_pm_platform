name: project-hub

services:
  postgres:
    image: postgres:17-alpine
    container_name: project-hub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-project_hub}
      POSTGRES_USER: ${POSTGRES_USER:-project_hub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-project_hub_local}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:8-alpine
    container_name: project-hub-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  object-storage:
    image: rustfs/rustfs@sha256:0dff1515b3c52b5ce8c5df2263420c7f93ae1c5d07cca79e19e57cff86b84c85
    container_name: project-hub-object-storage
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-project_hub}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-project_hub_local_secret}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - object_storage_data:/data

  object-storage-init:
    image: amazon/aws-cli@sha256:39a18bd7bd77fcc34d4a4fc64c3e1597b51d08996b681cc6167173886d7b6eaf
    container_name: project-hub-object-storage-init
    depends_on:
      object-storage:
        condition: service_started
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-project_hub}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-project_hub_local_secret}
      AWS_DEFAULT_REGION: ${S3_REGION:-ap-northeast-2}
      S3_BUCKET: ${S3_BUCKET:-project-hub-local}
    entrypoint:
      - /bin/sh
      - -c
      - >-
        until aws --endpoint-url http://object-storage:9000 s3api list-buckets >/dev/null 2>&1; do sleep 2; done &&
        (aws --endpoint-url http://object-storage:9000 s3api head-bucket --bucket "$${S3_BUCKET}" >/dev/null 2>&1 ||
        aws --endpoint-url http://object-storage:9000 s3api create-bucket --bucket "$${S3_BUCKET}")
    restart: "no"

volumes:
  postgres_data:
  redis_data:
  object_storage_data:
